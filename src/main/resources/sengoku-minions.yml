# ============================================================
#  战国 3v3（三局两胜）— 中地小兵
# ============================================================
#  场地中央会持续刷大量小兵，形成战场压力。
#  设计意图（需求第 17 条）：小兵应当【可以被绕过】，不强制清兵；
#  但清兵能攒能量。所以 ——
#    · 小兵不堵路、不封门，绕过去直接推进完全可行
#    · 击杀小兵给能量（见 sengoku-energy.yml），给"愿意清兵的人"回报
#    · 击杀小兵【不计对局积分】，否则刷小兵赢比赛会变成有效战术
#
#  小兵的刷新区域在 arenas.yml 的 arenas.<id>.sengoku.mid-minion-regions。
#  本文件不会被插件覆盖：改完执行 /taketori reload 即生效。
config-version: 1

# 载体：默认直接用月人的实体（需求允许"把月人改名，或者直接用月人"）
entity: ZOMBIE
display: '<gray>中地小兵</gray>'
# 刷新间隔（秒）与每次数量
interval-seconds: 6
per-spawn: 4
# 场上上限：达到就停止刷新（性能兜底，必须有）
max-alive: 40
# 分片：一轮刷新摊到 N 个 tick 上，避免一次性全刷造成尖峰。
# 实际生效值会被夹到"不超过刷新区数量"（设成 1 就是"一 tick 刷完全部区域"）。
shard-tick: 4
health: 20.0
damage: 4.0
