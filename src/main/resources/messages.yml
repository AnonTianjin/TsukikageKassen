  # 月面模板导入（moonmap import）
  import-started: '<gray>正在把服务器世界 <white>{world}</white> 复制为模板 <white>{id}</white>…'
  import-done: '<green>已导入模板 <white>{id}</white>，现在可以用 <white>/taketori arena setup {id}</white> 划定。'
