# 文案（MiniMessage 格式）。占位符使用 {name} 形式，避免与 MiniMessage 标签冲突。
prefix: '<gradient:#f5c26b:#f78fb3><bold>月影合战</bold></gradient> <dark_gray>»</dark_gray> '

command:
  no-permission: '<red>你没有权限执行该指令。'
  player-only: '<red>该指令只能由玩家执行。'
  reloaded: '<green>配置已重载：<white>{weapons} 把武器<green>、<white>{characters} 个角色<green>。'
  reload-failed: '<red>配置重载失败，已保留上一份可用配置：<gray>{reason}'
  unknown-sub: '<red>未知子命令。<gray>用法：/taketori <reload|give|character|debug|play>'
  usage-give: '<gray>用法：/taketori give <player> <weaponId>'
  usage-character: '<gray>用法：/taketori character <player> <characterId|none>'
  weapon-not-found: '<red>找不到武器：<white>{id}'
  character-not-found: '<red>找不到角色：<white>{id}'
  player-not-found: '<red>找不到玩家：<white>{name}'
  given: '<green>已给予 <white>{player}</white> 武器 <white>{weapon}</white>。'
  character-set: '<green>已将 <white>{player}</white> 的角色设为 <white>{character}</white>；对局进行中会立即换装，否则开局时统一发放。'
  character-cleared: '<green>已清除 <white>{player}</white> 的角色绑定与武器。'
  debug-on: '<green>调试模式已开启。'
  debug-off: '<yellow>调试模式已关闭。'
  debug-locked: '<yellow>调试模式未开启，请先在 config.yml 设置 debug: true 并执行 /taketori reload。'
  debug-header: '<gray>调试信息：<white>{info}'
  debug-runtime-on: '<green>调试模式已开启（本次运行有效）。按技能时控制台会打印 <white>[input] / [skill] / [combat]</white> 三类日志。'
  debug-runtime-off: '<yellow>调试模式已关闭。'
  debug-persist: '<gray>希望重启后仍生效，请修改 config.yml 的 <white>debug: true</white>。'
  doctor-header: '<gold>===== 月影合战 自检 ====='
  doctor-line: '<gray>{line}'
  doctor-footer: '<gold>========================='
  mode-not-weapon: '<red>主手不是插件武器，无法切换模式。'
  mode-result: '<gray>Q 槽技能结果：<white>{result}</white><gray>（SUCCESS=已切换 / NOT_BOUND=该武器没绑定 Q 技能 / ON_COOLDOWN=冷却中）'
  mode-detail: '<gray>武器 <white>{weapon}</white><gray>　当前模式 <white>{mode}</white><gray>　多模式武器：<white>{hasModes}'
  skills-header: '<gold>===== 当前武器技能 ====='
  skills-line: '<gray>{slot} <dark_gray>|</dark_gray> <white>{name}</white> <dark_gray>|</dark_gray> {state}'
  skills-footer: '<gold>========================'
  skills-empty: '<gray>主手不是插件武器（开局会按角色发放；管理可用 /taketori character 指定角色，或 /taketori give 发放）。'
  qmode-usage: '<gray>用法：/taketori qmode <drop|held-slot|none>，当前：<white>{current}'
  qmode-invalid: '<red>无效的值，可选：drop / held-slot / none'
  qmode-set: '<green>Q 键行为已设为 <white>{mode}</white>（本次运行有效）。'
  qmode-persist: '<gray>永久生效请修改 config.yml 的 <white>input.q-mode</white> 后 /taketori reload。'
  play-hint: '<gray>你的角色：<white>{character}</white><gray>，武器：<white>{weapons}'
  usage-shop: '<gray>用法：<white>/taketori shop</white> 打开界面，<white>/taketori shop <clipper|mine></white> 直接购买，<white>/taketori shop setnpc <red|blue></white> 记录商人位置。'
  usage-overtime: '<gray>用法：<white>/taketori overtime</white>（常规时间打完、比分未达标时投票进入加时赛）。'

input:
  on-cooldown: '<red>{skill}</red> <gray>冷却中：<white>{time}s'
  on-cooldown-bar: '<red>{skill}</red> <gray>{bar}</gray> <white>{time}s'
  no-character: '<red>你还没有绑定角色，请联系管理员使用 /taketori character。'
  wrong-weapon: '<red>该武器不属于你的角色。'
  mode-switched: '<gray>模式：<white>{mode}</white> <dark_gray>({id})'
  equip-switched: '<gray>已切换到 <white>{weapon}</white>'
  equip-missing: '<red>你身上没有 <white>{weapon}</white>，已为你补发。'
  special-shot-on: '<aqua>特殊射击：<green>开启'
  special-shot-off: '<aqua>特殊射击：<red>关闭'

skill:
  no-target: '<gray>没有可牵引的目标。'
  mark-apply: '<green>易伤标记 <white>{count}</white> 个目标 <gray>（受到伤害 +{bonus}%，持续 {seconds} 秒）'
  armor-break: '<green>破甲 <white>{count}</white> 个目标 <gray>（受到伤害 +{bonus}%，持续 {seconds} 秒 · {stacks} 层）'
  zone-ready: '<green>领域已展开 <gray>（持续 {seconds} 秒）'
  summon-ready: '<green>守夜犬已就位 <gray>（存活 {seconds} 秒）'
  echo-consume: '<gold>兑现！<gray>目标带着前置状态，本次伤害 ×{bonus}%'
  mirror-ready: '<light_purple>镜面展开：<white>{time}s'
  guard-ready: '<aqua>强化防御：<white>{time}s'
  grapple-miss: '<gray>钢丝落空。'
  boost-defly: '<yellow>已取消飞行状态（飞行时推进不会生效）'
  shockwave-none: '<gray>冲击波没有命中的目标（<white>{radius}</white> 格内没有敌人）'

# ── 战国 3v3（三局两胜）──────────────────────────────────
sengoku:
  keep-protected: '<red>天守阁不可直接破坏 <gray>——用大将击破器'
  freeze-applied: '<aqua>已冻结 <white>{target}</white></aqua> <gray>{time}s'
  # 小局流程
  round-start: '<yellow>第 <white>{round}</white> 小局开始 <gray>（当前比分 <white>{score}</white>，三局两胜）'
  round-draw: '<gray>第 <white>{round}</white> 小局无人获胜（<white>{reason}</white>）<gray>——本局重开'
  round-won: '<green>{team} 拿下第 <white>{round}</white> 小局 <gray>（<white>{reason}</white>，用时 {seconds} 秒）<gray>　比分 <white>{score}</white>'
  match-won: '<green>{team} 以 <white>{score}</white> 赢得整场！'
  match-draw: '<yellow>整场结束：<gray>双方战平'
  round-restart-failed: '<yellow>下一小局无法开始（<white>{reason}</white>），本场提前结束'
  paused: '<yellow>对局已由管理员暂停'
  resumed: '<green>对局已继续'
  # 箭楼
  tower-captured: '<yellow>⚑ {team} 占领了 {tower}</yellow>{previous}'
  tower-previous: ' <gray>（原属 {team}）'
  tower-guards-cleared: '<green>{tower} 的守卫已被肃清<gray>——{seconds} 秒内敲响铜钟即可占领'
  tower-guards-alive: '<gray>先清掉箭楼附近的守卫（剩余 {count}）'
  tower-already-yours: '<gray>这座箭楼已经属于你们。'
  tower-bell-rung: '<yellow>{team} 敲响了 {tower} 的铜钟<gray>——站进占领区读条'
  tower-contested: '<red>箭楼争夺中 <gray>——双方进度停滞，先把对面赶出去'
  tower-progress: '<yellow>占领 {tower}</yellow> <gray>{bar} <white>{percent}%'
  # 大将击破器
  breaker-spawned: '<gold>大将击破器已出现在 {keep} <gray>——{team} 可取'
  breaker-picked: '<gold>已拾取大将击破器 <gray>——带到 {keep} 范围内读条'
  breaker-armed: '<gold>{player} 用大将击破器攻陷了 {keep}！'
  breaker-progress: '<gold>破坏 {keep}</gold> <gray>{bar} <white>{percent}%'
  breaker-leave: '<gray>带着击破器进入 {keep} 范围内才能开始破坏'
  breaker-undroppable: '<red>大将击破器不能丢弃 <gray>——只能带着，或阵亡时掉落'
  breaker-unconsumable: '<red>大将击破器不能被消耗 <gray>——它只用来破坏敌方天守阁'
  breaker-not-yours: '<red>这是 {team} 的击破器'
  breaker-role-blocked: '<red>该角色无法操作大将击破器 <gray>——交给队友'
  # 跳跃台
  jumppad-ready: '<green>{team} 的跳跃台已出现在己方天守阁门前<gray>——复活后踩上去即可直达已占领的箭楼'
  jumppad-no-target: '<gray>暂时没有可前往的己方箭楼'
  # 能量与必杀
  energy-full: '<gold>能量已满 <gray>——按 <white>Q</white> 释放必杀技'
  energy-bar: '<aqua>能量 {bar} <white>{current}/{max}'
  ultimate-cast: '<gold>必杀技已释放 <gray>——能量清空，继续攒'
  ultimate-broadcast: '<gold>{player} 释放了必杀技 <gray>（命中 {count} 个目标）'

# BedWars 式多房间匹配：大厅 → 匹配 → 房间等待区 → 倒计时开局（玻璃笼）→ 结算回大厅
room:
  # 匹配与进出
  join-success: '<green>已加入房间 <white>{room}</white>，正在前往等待区…'
  join-broadcast: '<gray>{player} 加入了房间 <dark_gray>(<white>{count}/{max}</white>)'
  leave: '<yellow>你已离开房间，正在返回大厅。'
  leave-broadcast: '<gray>{player} 离开了房间 <dark_gray>(<white>{count}/{max}</white>)'
  leave-match-broadcast: '<gray>{player} <dark_gray>({team})<gray> 退出了本局，其位置可由他人补位。'
  leave-match: '<yellow>你已退出本局对局，正在返回大厅。'
  leave-match-rejoinable: '<yellow>你已退出本局对局，正在返回大厅。<gray>重连窗口内可用 <white>/taketori rejoin</white> 回到原队。'
  no-room: '<red>当前没有可加入的房间，请稍后再试或联系管理员配置场地。'
  room-full: '<red>房间 <white>{room}</white> 已经满员。'
  room-started: '<red>该房间已经开局，无法中途加入。<gray>可在房间列表选择旁观。'
  already-in: '<yellow>你已经在房间 <white>{room}</white> 里了。'
  not-in-room: '<gray>你当前不在任何房间里。'
  switch-room: '<gray>已从原房间切换到 <white>{room}</white>。'
  spectating: '<gray>你正在旁观房间 <white>{room}</white>。<gray>再次点击旁观者按钮可返回大厅。'
  # 倒计时
  countdown: '<gold>游戏将在 <white>{seconds} </white>秒后开始…'
  countdown-full: '<gold>人数已满！游戏将在 <white>{seconds} </white>秒后开始！'
  countdown-cancel: '<yellow>在线人数不足，开局倒计时已取消，继续等待其他玩家加入…'
  cage-hold: '<aqua>开局准备：<white>{seconds} </white>秒后玻璃笼解除，正式开战！'
  # 结算
  end-return: '<gray>对局结束，正在返回大厅…'
  # 房间列表 GUI
  list-title: '房间列表'
  list-quick-join: '<green>快速加入'
  list-quick-join-lore: '<gray>自动加入人最多的等待房间'
  list-leave: '<yellow>离开回大厅'
  list-status-waiting: '<aqua>等待中'
  list-status-starting: '<gold>倒计时 <white>{seconds}s'
  list-status-caged: '<light_purple>开局准备中'
  list-status-playing: '<red>游戏中 <gray>{time}'
  list-status-ending: '<gray>结算中'
  list-mode-pvp: '<red>PVP 红蓝对抗'
  list-mode-pve: '<blue>PVE 月人入侵'
  list-players: '<gray>人数 <white>{count}/{max}'
  list-click-join: '<green>▸ 点击加入该房间'
  list-click-spectate: '<aqua>▸ 点击旁观该房间'
  list-full: '<dark_gray>房间已满'
  list-disabled: '<dark_gray>房间未开放'
  list-not-ready: '<yellow>场地未就绪 <gray>({missing})'
  # 场地管理命令
  arena-created: '<green>已创建场地 <white>{id}</white> 并自动选中，开始用选区工具/指令划定吧。'
  arena-exists: '<red>场地 <white>{id}</white> 已存在。'
  arena-not-found: '<red>找不到场地：<white>{id}'
  arena-selected: '<green>当前操作场地：<white>{id}</white>（后续 set*/del* 都作用于它）'
  arena-not-selected: '<red>你还没有选中场地。<gray>先用 /taketori arena select <id> 或 create <id>。'
  arena-deleted: '<green>已删除场地 <white>{id}</white>。'
