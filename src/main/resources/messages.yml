  template-not-ready: '<red>模板 <white>{template}</white> 未就绪：<gray>{missing}'
  template-missing: '<red>moonmaps 里找不到模板 <white>{template}</white> 的世界文件夹。<gray>把世界文件夹放进 moonmaps/，或用 <white>/taketori moonmap import <世界名> {template}</white> 导入服务器已有世界。'
  room-deleted: '<yellow>房间 <white>{room}</white> 已删除，世界已回收。'
  room-delete-denied: '<red>只有房主或管理员可以删除该房间（且仅等待中的房间）。'
  reinforced: '<green>已补位加入 <white>{room}</white>！对局装备已发放，直接参战。'
