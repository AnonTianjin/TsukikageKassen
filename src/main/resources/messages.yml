  cancelled: '<yellow>已放弃场地 <white>{id}</white> 的划定会话（编辑世界仍加载着，可用 moonmap unload 保存）。'
  checklist-header: '<gold>===== 划定清单 <white>{id}</white>（世界 <white>{world}</white>）====='
  checklist-missing: '<gray>还缺：<white>{missing}'
  checklist-howto: '<dark_gray>用选区锄（arena wand）在本世界划区域，setminion/setbase/setloot/setwait/setspawn 逐项设置，每项设置后本清单会自动刷新。'

# 对局功能壳（鹦鹉螺壳）打开的「退出对局 / 投降」GUI
room-shell:
  title: '<dark_gray>对局面板'
  # 物品本身
  undroppable: '<gray>对局面板不能丢弃（右键可打开）。'
  locked: '<gray>对局面板不能移动或放入容器。'
  not-in-room: '<gray>你当前不在对局房间里，无法使用对局面板。'
  # 退出按钮
  leave-room: '<yellow>退出房间'
  leave-room-lore: '<gray>离开等待区并返回大厅'
  leave-match: '<red>退出对局'
  leave-match-lore: '<gray>释放你的槽位（队友可等补位）'
  leave-confirm: '<dark_red><bold>再次点击确认退出'
  leave-confirm-lore: '<gray>确认后将返回大厅；重连窗口内可 /taketori rejoin 回到原队'
  leave-unavailable: '<gray>当前不可退出'
  leave-unavailable-lore: '<gray>结算阶段无需退出，稍候会自动返回大厅'
  # 投降按钮
  surrender: '<red>队伍投降'
  surrender-lore: '<gray>发起后 30 秒内半数以上在线队友同意即判负结束'
  surrender-progress: '<gray>当前 <white>{confirmed}/{need}</white> 票，剩余 <white>{seconds}s'
  surrender-unavailable: '<gray>当前不可投降'
  surrender-unavailable-lore: '<gray>需在对局正式开战（玻璃笼解除）后使用'
  # 中间信息位
  info: '<aqua>对局信息'
  info-outside: '<gray>你当前不在房间内'
  info-phase: '<gray>阶段：<white>{phase}'
  info-team: '<gray>你的队伍：<white>{team}'

# 队伍商店（商人 NPC / 指令打开的 27 格界面）
#   · 拆弹钳只有红队能买，地雷只有蓝队能买——判错队伍的提示走 wrong-team
#   · 界面里的 lore 是单行字符串（Messages 只收字符串值，写成列表会被忽略）
#   · 占位符必须与 ShopMenu 的调用一致：lore 用 {clipper-seconds}/{bare-seconds}/{kill-radius}/{trigger-radius}，
#     价格行用 {cost}/{max}，余额用 {score}
shop:
  title: '<dark_gray>{team} 商店'
  balance: '<gray>当前积分：<white>{score}'
  # 拆弹钳（红队专属）
  clipper:
    name: '<gold>拆弹钳'
    lore: '<gray>红队专属 · 拆弹读条缩短至 <white>{clipper-seconds}s</white>（空手需 <white>{bare-seconds}s</white>）'
    cost: '<gray>价格：<white>{cost}</white> 积分 · 限购 <white>{max}</white> 把/人'
  # 地雷（蓝队专属）
  mine:
    name: '<aqua>地雷'
    lore: '<gray>蓝队专属 · 杀伤半径 <white>{kill-radius}</white> 格（必死）· 触发半径 <white>{trigger-radius}</white> 格'
    cost: '<gray>价格：<white>{cost}</white> 积分 · 限购 <white>{max}</white> 个/队'
  close: '<red>关闭商店'
  hint: '<gray>点击购买 · 右键商人可随时打开'
  # 购买失败/不可用的提示（成功与位置记录由对局内播报硬编码，这里不再重复一份）
  insufficient: '<red>积分不足：需要 <white>{cost}</white> 分，你只有 <white>{score}</white> 分。'
  limit: '<red>已达上限（<white>{max}</white>）。'
  wrong-team: '<red>这件道具只有对应队伍能买：红队买拆弹钳、蓝队买地雷。'
  not-running: '<gray>对局尚未开始，商店暂不营业。'
