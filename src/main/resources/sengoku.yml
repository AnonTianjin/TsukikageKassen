# ============================================================
#  战国 3v3（三局两胜）— 对局骨架
# ============================================================
#  这是新模式独有的配置。点位（天守阁 / 箭楼 / 铜钟 / 守卫点 / 中地小兵区 /
#  跳跃台）在 arenas.yml 的 arenas.<id>.sengoku 段里，由选区工具划定。
#
#  本文件不会被插件覆盖：改完执行 /taketori reload 即生效。
#  配置模板版本（改动默认结构时 +1，插件只在控制台提示，不动你的文件）
config-version: 1

# ── 对局结构 ─────────────────────────────────────────────
rounds:
  # 整场赛制：3 = 三局两胜、5 = 五局三胜。
  # 写成偶数会被规整成奇数（2 → 3），0 或负数兜底成 1，避免赛制卡死打不出胜者。
  best-of: 3
  # 单个小局的时限（分钟）。到点按 timeout-winner 判定。
  time-limit-minutes: 8
  # 超时判定：
  #   tower-count = 箭楼占领数多者胜，持平判平局重开（推荐：防龟缩）
  #   draw        = 直接判平局重开
  timeout-winner: tower-count

# ── 天守阁 ───────────────────────────────────────────────
keep:
  # 天守阁永久不可直接破坏——只能被大将击破器攻陷。
  # 这是它的性质而不是某个阶段的状态，所以关掉它也没有"可打"的中间态。
  invulnerable: true
  # 击破器在敌方天守阁范围内的读条判定半径（格）
  arm-radius: 4.0
  # 是否拦截天守阁区域内的方块破坏与爆炸。
  # 天守阁是纯方块结构，所以只需要拦这两类事件。
  protect-blocks: true
