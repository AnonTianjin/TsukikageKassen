# =============================================================================
# 月影合战 · 武器定义（2.0 三技能模型）
# =============================================================================
#
# 每把武器只有三个技能位，外加一个不占键位的被动：
#
#   passive:      武器级被动。近战命中 / 箭矢命中时结算（近战用 chance，
#                 远程用 throw-chance），另可带常驻属性 speed / resistance / jump。
#   skills.left:  左键。近战武器留空 = 原版普攻；只有弓在这里放主动技能。
#   skills.right: 右键。留空 = 原版行为（弓拉弓、三叉戟投掷、盾格挡）。
#   skills.sneak: 双击潜行。只允许移动类：self_boost / blink / rocket_jump / grapple。
#
# 已下线的写法（加载时会点名报错，不会静默失效）：
#   shift-right:  第三槽已改为双击潜行，键名改为 sneak
#   q:            Q 槽与模式切换整体移除
#   modes: / default-mode:   武器不再有模式，一把武器一套技能
#   把 passive 写进 left:     被动应写在顶层 passive: 段
#
# 改完执行 /taketori reload。启动与重载时会自动校验参数键与名字。
# =============================================================================

