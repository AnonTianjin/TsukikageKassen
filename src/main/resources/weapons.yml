    model-data: 0
    lore:
      - '<gray>左键 <white>瞄准射击（主动挂易伤 + 自身隐身）'
      - '<gray>右键 <white>原版拉弓（由拉弓事件结算，不消耗箭）'
      - '<gray>Shift+右键 <white>切换特殊射击（强化 + 易伤标记）'
      - '<gray>Q <white>单发射击 / 三连射'
      - '<gray>命中 <white>随机附加一种负面效果（减速 / 虚弱 / 中毒…）'
    attributes:
      attack-speed: 1.0
    # 命中附加：箭射中敌人时，从下面随机抽一种负面效果施加（夕月的压制手段）
    #   同队玩家免疫；效果名用原版药水效果名，写错只会在 debug 日志里点名，不会报错
    hit-effects:
      arrow-debuffs: [ SLOWNESS, WEAKNESS, POISON, BLINDNESS, HUNGER, NAUSEA ]
      arrow-debuff-ticks: 80      # 持续 4 秒
      arrow-debuff-amplifier: 0   # 等级：0 = I 级，1 = II 级
      arrow-debuff-chance: 1.0    # 触发概率：1.0 = 每箭必中；0.5 = 一半概率
    default-mode: NORMAL
    modes:
      NORMAL:
        display: '<green>单发射击</green>'
      VOLLEY:
        display: '<red>三连射</red>'
    skills:
      left:
        # 2.0：把标记从"开了开关随便射"变成一次主动输入
        type: mark_apply
        cooldown: 10.0
        params:
          display: '瞄准射击'
          damage: 4.0
          radius: 14.0         # ≥ 8.0 → 走视线射线，这个值当射程用（不是贴身范围）
          angle: 30.0          # 瞄准半角：要真的对准才会挂上
          mark-bonus: 0.25
          mark-ticks: 100      # 5 秒易伤 +25%
          invisible-ticks: 40  # 自己隐身 2 秒，重新找角度
          particle: CRIT
          sound: ENTITY_ARROW_SHOOT
      shift-right:
        type: special_shot_toggle
        cooldown: 1.0
        params:
          display: '特殊射击'
          # 特殊射击（按 Shift+右键切换，ActionBar 会提示开启/关闭）：
          # 命中时伤害更高 + 范围溅射 + 给目标打易伤标记，并且箭会带飞行拖尾
          damage-multiplier: 1.5
          speed-multiplier: 1.15
          hit-radius: 2.0          # 命中时对周围 2 格内的其他敌人溅射
          hit-radius-ratio: 0.3    # 溅射伤害 = 主伤害 × 0.3
          trail-particle: CRIT     # 飞行拖尾粒子，让强化箭肉眼可辨（留空 = 不显示）
          mark-bonus: 0.25         # 被打中的人受到的所有伤害 +25%
          mark-ticks: 100          # 标记持续 5 秒
          # 三连射（Q 切到 VOLLEY 模式后生效）：
          volley-interval: 2       # 每支箭间隔 2 tick —— 同时发射会完全重叠、看起来只有一支
          volley-spread: 1.5       # 每支箭的微小散布角（度）；0 = 完全同向
          particle: CRIT
          sound: BLOCK_BEACON_ACTIVATE
      q:
        type: mode_switch
        cooldown: 0
        params: { }

