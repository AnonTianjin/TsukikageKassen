# 月影合战 · 武器定义（配置模板 v10）
#
# config-version = 配置模板版本（不是插件版本）。
# 插件升级时【不会覆盖】你的数值文件，所以模板更新后需要你自己同步：
#   备份并删除 plugins/TsukikageKassen/weapons.yml → 执行 /taketori reload 重新生成
# 启动时若检测到模板版本落后，控制台会明确提示。
config-version: 10
#
# 位移类技能（self_boost / rocket_jump）默认走【纯药水】boost-mode: potion：
#   SPEED        跑得更快（"推进"的持续感）
#   JUMP_BOOST   跳得更高
#   LEVITATION   自动上升（有向上分量的技能会启用；每级约 +0.05 格/tick，等级与 tick 可配）
#   全部是原版效果，不受位置纠正与反作弊影响；原版【没有】自动水平位移的药水，
#   所以水平方向表现为"跑得更快"，而不是"被推出去"。
#
# 备选路径（改一行 boost-mode 即可）：
#   teleport     逐 tick 传送：位移最确定，但观感硬，部分服务器的反作弊/领地插件会拦截
#   velocity     调 setVelocity：最平滑，但速度可能被位置纠正立刻清除
#
# 药水参数：
#   potion-ticks / potion-speed / potion-jump / potion-slow-falling
#   potion-levitation / potion-levitation-amplifier / potion-levitation-ticks
#
# 按键：左键 left / 右键 right / Shift+右键 shift-right / Q q
#
# ============================ 数值基准：穿全套铁甲的玩家 ============================
# 铁甲全套 = 15 点护甲 → 减伤 15/(15+8) ≈ 65.2%，即【实际伤害 ≈ 配置伤害 × 0.35】。
# 反推：想"对铁甲 N 击击杀"（20 血）→ 配置伤害 ≈ 20 / N × 2.87。
#
# ============================ 本次重做的重点：模式 = 玩法，不是数字 ============================
# 每个 Q 模式切换都必须改变"你该怎么打"：
#   月读：重锤（砸地击飞 + 火箭跳进场）↔ 火箭（远程范围压制，近战变弱）
#   将军　：近战（最高单击 + 震地击飞 + 掷棒补距离）↔ 远程（投掷，但近战被削弱）
#   盾胁　：防御（正常机动）↔ 壁垒（抗性更强，但给自己挂缓慢 = 用机动换硬度）
#   月镜：镜面（反射飞行物，专治远程）↔ 爆发（主动范围控制）
#   旗鱼：冰冻（减速）↔ 极寒（定身）
#
# 新增机制（详见 技能树.md）：
#   shockwave   360° 冲击 + 向上击飞        → 月读重锤左键、将军震地
#   rocket_jump 用爆炸把自己送出去           → 月读重锤右键
#   pull        把敌人拉向你（与钢丝牵引相反）→ 疾风钢丝右键
#   reflect     把飞行物弹回发射者           → 月镜镜面模式
#   melee_smash 连击参数 combo-bonus         → 疾风剑左键（连续命中叠伤）
#   projectile  定身参数 freeze-ticks        → 旗鱼极寒模式
#   special_shot 易伤标记 mark-bonus         → 夕月（标记目标，全队收益）
#
# ============================ 2.0 版新增：5 个技能类型 + 4 种机制 ============================
# 2.0 版围绕"现有稀缺机制"做了体系化补完（详见 docs/武器技能设计-2.0.md），
# 新增 5 个技能类型：
#   mark_apply   易伤标记施加  → 月读镇魂铃右键、夕月弓左键（主动挂标记，全队受益）
#   armor_break  破甲 / 削防   → 将军金棒震地、盾胁令旗 Shift+右键（削防后由队友兑现）
#   echo_consume 标记 / 破甲兑现（本版按"现有类型 + echo-bonus"写，兑现条件由代码判定）
#   deploy_zone  场地技能      → 月读镇魂铃治疗场、吉野丝网陷阱（静态领域，周期结算）
#   summon_ally  召唤单位      → 铁卫碎岩牙唤犬（12 秒存活，45 秒冷却，击杀不计分）
# 以及四种新机制：
#   破甲    armor-pierce（硬上限 0.30）+ debuff-ticks / debuff-stacks，与易伤标记独立结算、可共存
#   标记    mark-bonus / mark-ticks，覆盖语义不叠加；echo-bonus 为"兑现"倍率，只在目标身上带
#           标记 / 破甲 / 减速 / 冻结时生效（echo-bonus ≤ 1.0 等同关闭）
#   场地    deploy_zone 的 radius / duration-ticks / period-ticks：对敌伤害与减速，对友治疗与吸收
#   召唤    summon_ally 的 entity / count / health / damage / duration-ticks：召唤物带 PDC 归属标记，
#           队友与召唤者不能伤害它，到期 / 房间销毁时统一回收
# 新参数键（mark-bonus、armor-pierce、blink 的 reserve-*、pull 的 decelerate-*、
# shield_guard 的 ally-* 等）都会在启动与 /taketori reload 时被参数键校验逐条点名。
#
# 改完执行 /taketori reload。启动与重载时会自动校验参数键与名字。

weapons:

  # ======================================================== 月读 · 陨星锤
  tsukuyomi_hammer:
    character: tsukuyomi
    display: '<gold>陨星锤</gold>'
    material: DIAMOND_SHOVEL
    model-data: 0
    lore:
      - '<gray>左键 <white>重锤模式=砸地冲击 / 火箭模式=锤击'
      - '<gray>右键 <white>重锤模式=火箭跳 / 火箭模式=火箭弹'
      - '<gray>Shift+右键 <white>喷射推进'
      - '<gray>Q <white>重锤 / 火箭 模式切换'
    attributes:
      attack-damage: 16.0
      attack-speed: 1.0
    default-mode: HAMMER
    modes:
      HAMMER:
        display: '<yellow>重锤模式</yellow>'
        skills:
          left:
            type: shockwave
            cooldown: 0
            params:
              display: '砸地冲击'
              damage: 14.0
              radius: 3.5
              knockback: 0.4
              launch: 0.5
              min-falloff: 0.6
              # 砸地顺手给目标上 3 秒易伤 +25%：接上火箭弹（16.0 → 吃标记放大）
              mark-bonus: 0.25
              mark-ticks: 60
              particle: EXPLOSION
              sound: BLOCK_ANVIL_LAND
          right:
            type: rocket_jump
            cooldown: 6.0
            params:
              display: '火箭跳'
              upward: 0.95
              backward: 0.45
              self-damage: 0.0
              fall-immunity-ticks: 80
              # 落地后仍有 2 秒跳跃提升 VI，接得上第二段火箭跳
              potion-jump: 5      # 5 = VI 级（0 = I 级）
              potion-ticks: 40    # 40 tick = 2 秒
              particle: EXPLOSION
              sound: ENTITY_GENERIC_EXPLODE
      ROCKET:
        display: '<red>火箭模式</red>'
        skills:
          left:
            type: melee_smash
            cooldown: 0
            params:
              display: '锤击'
              damage: 10.0
              range: 3.2
              angle: 55
              knockback: 0.35
              particle: SWEEP_ATTACK
              sound: ENTITY_PLAYER_ATTACK_STRONG
          right:
            type: projectile
            cooldown: 3.0
            params:
              display: '火箭弹'
              projectile: SMALL_FIREBALL
              speed: 1.8
              damage: 16.0
              radius: 2.5
              ignite: true
              ignite-ticks: 40
              min-falloff: 0.6
              particle: FLAME
              hit-particle: FLAME
              sound: ENTITY_FIREWORK_ROCKET_LAUNCH
              hit-sound: ENTITY_GENERIC_EXPLODE
    skills:
      left:
        type: melee_smash
        cooldown: 0
        params:
          display: '锤击'
          damage: 12.0
          range: 3.2
          angle: 55
          knockback: 0.4
          particle: SWEEP_ATTACK
          sound: ENTITY_PLAYER_ATTACK_STRONG
      right:
        type: projectile
        cooldown: 3.0
        params:
          display: '火箭弹'
          projectile: SMALL_FIREBALL
          speed: 1.6
          damage: 14.0
          radius: 2.0
          ignite: true
          ignite-ticks: 30
          min-falloff: 0.6
          particle: FLAME
          hit-particle: FLAME
          sound: ENTITY_FIREWORK_ROCKET_LAUNCH
          hit-sound: ENTITY_GENERIC_EXPLODE
      shift-right:
        type: self_boost
        cooldown: 8.0
        params:
          display: '喷射推进'
          power: 1.45
          upward: 0.3
          min-lift: 0.42
          boost-ticks: 4
          boost-keep-ratio: 0.7
          fall-immunity-ticks: 70
          particle: CLOUD
          sound: ENTITY_FIREWORK_ROCKET_SHOOT
      q:
        type: mode_switch
        cooldown: 0
        params: { }

  # ======================================================== 月读 · 镇魂铃（2.0 新增 · 挂易伤 + 团队补给）
  # 定位：纯支援武器。左键清点自救，右键给全队开伤害窗口，第三槽在据点留治疗场。
  tsukuyomi_bell:
    character: tsukuyomi
    display: '<light_purple>镇魂铃</light_purple>'
    material: AMETHYST_SHARD
    model-data: 0
    lore:
      - '<gray>左键 <white>月华冲击（小范围击飞）'
      - '<gray>右键 <white>月华印记（范围挂易伤 +22%）'
      - '<gray>Shift+右键 <white>月华庇护（治疗场 + 吸收）'
      - '<gray>Q <white>保留（当前为单模式）'
    attributes:
      attack-damage: 9.0
      attack-speed: 1.2
    default-mode: BELL
    modes:
      BELL:
        display: '<light_purple>镇魂铃</light_purple>'
    skills:
      left:
        type: shockwave
        cooldown: 0
        params:
          display: '月华冲击'
          damage: 9.0
          radius: 3.2
          knockback: 0.5
          launch: 0.35
          min-falloff: 0.6
          particle: END_ROD
          sound: BLOCK_BEACON_ACTIVATE
      right:
        type: mark_apply
        cooldown: 9.0
        params:
          display: '月华印记'
          damage: 5.0
          radius: 3.6
          mark-bonus: 0.22    # 目标受到的所有伤害 +22%（覆盖语义，不叠加）
          mark-ticks: 80      # 标记持续 4 秒 —— 这就是组合技窗口
          slow-duration: 40
          slow-amplifier: 0
          particle: END_ROD
          sound: BLOCK_AMETHYST_BLOCK_CHIME
      shift-right:
        type: deploy_zone
        cooldown: 22.0
        params:
          display: '月华庇护'
          radius: 4.0
          duration-ticks: 120     # 6 秒治疗场
          period-ticks: 20        # 每 1 秒结算一次
          heal-per-second: 1.0    # 6 秒共 6.0 血（约 1/3 条命），必须站桩
          absorption: 4.0
          ally-radius: 4.0        # >0 才对友方生效（含自己）
          particle: HEART
          sound: BLOCK_BEACON_ACTIVATE
      q:
        type: mode_switch
        cooldown: 0
        params: { }

  # ======================================================== 将军 · 金棒
  shogun_konbo:
    character: shogun
    display: '<dark_purple>金棒</dark_purple>'
    material: NETHERITE_AXE
    model-data: 0
    lore:
      - '<gray>左键 <white>金棒攻击（远程模式会削弱）'
      - '<gray>右键 <white>近战模式=掷棒 / 远程模式=金棒投掷'
      - '<gray>Shift+右键 <white>近战模式=金棒震地（击飞 + 破甲）/ 远程模式=崩山一击'
      - '<gray>Q <white>近战 / 远程 模式切换'
    attributes:
      attack-damage: 18.0
      attack-speed: 0.9
    default-mode: MELEE
    modes:
      MELEE:
        display: '<yellow>近战模式</yellow>'
        skills:
          right:
            # 2.0：近战模式的右键由"切模式"改为"掷棒"，让近战也有中距离补伤手段
            type: projectile
            cooldown: 5.0
            params:
              display: '掷棒'
              projectile: SNOWBALL
              gravity: false
              speed: 2.2
              damage: 9.0
              radius: 1.2
              particle: CRIT
              hit-particle: CRIT
              sound: ENTITY_SNOWBALL_THROW
              hit-sound: ENTITY_PLAYER_ATTACK_STRONG
          shift-right:
            # 2.0：震地由纯 shockwave 改为 armor_break —— 保留原半径/击飞/音效，追加 2 层破甲
            type: armor_break
            cooldown: 8.0
            params:
              display: '金棒震地'
              damage: 16.0
              radius: 3.5
              knockback: 0.6
              launch: 0.5
              min-falloff: 0.6
              armor-pierce: 0.18   # 目标受到的伤害 +18%（硬上限 0.30）
              debuff-ticks: 120    # 破甲持续 6 秒 = 太刀居合斩的连招窗口
              debuff-stacks: 2     # 层数只用于提示与语义，强度由 armor-pierce 决定
              particle: EXPLOSION
              sound: BLOCK_ANVIL_LAND
      RANGED:
        display: '<aqua>远程模式</aqua>'
        skills:
          left:
            type: melee_smash
            cooldown: 0
            params:
              display: '金棒扫击'
              damage: 12.0
              range: 3.0
              angle: 50
              knockback: 0.3
              particle: ENCHANTED_HIT
              sound: ENTITY_PLAYER_ATTACK_STRONG
          right:
            type: projectile
            cooldown: 1.2
            params:
              display: '金棒投掷'
              projectile: SNOWBALL
              gravity: false
              speed: 2.4
              damage: 11.0
              radius: 1.5
              particle: CRIT
              hit-particle: CRIT
              sound: ENTITY_SNOWBALL_THROW
              hit-sound: ENTITY_PLAYER_ATTACK_STRONG
          shift-right:
            type: projectile
            cooldown: 7.0
            params:
              display: '崩山一击'
              projectile: SNOWBALL
              gravity: false
              speed: 2.0
              damage: 18.0
              radius: 3.0
              knockback: 0.8
              particle: ENCHANTED_HIT
              hit-particle: ENCHANTED_HIT
              sound: ENTITY_SNOWBALL_THROW
              hit-sound: ENTITY_GENERIC_EXPLODE
    skills:
      # 两种模式的 right / shift-right 都各自定义，这里只留通用的左键
      left:
        type: melee_smash
        cooldown: 0
        params:
          display: '金棒攻击'
          damage: 18.0
          range: 3.0
          angle: 50
          knockback: 0.4
          particle: ENCHANTED_HIT
          sound: ENTITY_PLAYER_ATTACK_STRONG
      q:
        type: mode_switch
        cooldown: 0
        params: { }

  # ======================================================== 疾风 · 剑（连击 + 标记兑现）
  hayate_sword:
    character: hayate
    display: '<white>疾风之剑</white>'
    material: NETHERITE_SWORD
    model-data: 0
    lore:
      - '<gray>左键 <white>剑击（连续命中伤害递增，目标带标记再放大）'
      - '<gray>右键 <white>高速突进'
      - '<gray>Shift+右键 <white>强化机动（上抛）'
      - '<gray>Q <white>切换到钢丝'
      - '<gray>1 / 2 / 3 <white>切换剑 / 钢丝 / 苦无'
    attributes:
      attack-damage: 11.0
      attack-speed: 1.6
    default-mode: SWORD
    modes:
      SWORD:
        display: '<white>剑模式</white>'
    skills:
      left:
        type: melee_smash
        cooldown: 0
        params:
          display: '剑击'
          damage: 10.0
          range: 3.2
          angle: 50
          knockback: 0.3
          combo-bonus: 0.25
          combo-window: 20     # 连击窗口 1 秒：1 秒内没有新的命中 → 伤害衰减回基础值 10
          combo-cap: 20.0      # 连击叠伤上限：不管叠到多少段，单击伤害不超过 20
          echo-bonus: 1.4      # 目标带标记 / 破甲 / 减速 / 冰冻时 ×1.4（被 combo-cap 封顶）
          particle: SWEEP_ATTACK
          sound: ENTITY_PLAYER_ATTACK_SWEEP
      right:
        type: self_boost
        cooldown: 7.0
        params:
          display: '高速突进'
          power: 1.6
          upward: 0.06
          min-lift: 0.42
          boost-ticks: 4
          boost-keep-ratio: 0.7
          fall-immunity-ticks: 50
          particle: CLOUD
          sound: ENTITY_ENDERMAN_TELEPORT
      shift-right:
        type: self_boost
        cooldown: 12.0
        params:
          display: '强化机动'
          power: 1.05
          upward: 0.55
          min-lift: 0.45
          boost-ticks: 3
          boost-keep-ratio: 0.6
          fall-immunity-ticks: 70
          particle: END_ROD
          sound: ENTITY_ILLUSIONER_MIRROR_MOVE
      q:
        type: equip_switch
        cooldown: 1.0
        params:
          target: hayate_wire

  # ======================================================== 疾风 · 钢丝（拉人）
  hayate_wire:
    character: hayate
    display: '<gray>钢丝</gray>'
    material: FISHING_ROD
    model-data: 0
    lore:
      - '<gray>左键 <white>钢丝横扫（宽扇面清点）'
      - '<gray>右键 <white>钢丝牵引（把敌人拉向你并减速）'
      - '<gray>Shift+右键 <white>快速位移'
      - '<gray>Q <white>切换到剑'
      - '<gray>1 / 2 / 3 <white>切换剑 / 钢丝 / 苦无'
    attributes:
      attack-speed: 1.2
    default-mode: WIRE
    modes:
      WIRE:
        display: '<gray>钢丝模式</gray>'
    skills:
      left:
        # 2.0：补上原本空缺的左键，钢丝不再是"没技能就废"
        type: melee_smash
        cooldown: 0
        params:
          display: '钢丝横扫'
          damage: 8.0
          range: 3.6
          angle: 90
          knockback: 0.25
          particle: SWEEP_ATTACK
          sound: ENTITY_PLAYER_ATTACK_SWEEP
      right:
        type: pull
        cooldown: 6.0
        params:
          display: '钢丝牵引'
          mode: auto
          range: 14.0
          power: 0.55
          duration: 0.4
          angle: 50
          damage: 0.0
          decelerate-amplifier: 1   # 拉扯命中后顺手削一点机动，方便剑接上
          decelerate-ticks: 40
          particle: END_ROD
          sound: ITEM_TRIDENT_RETURN
      shift-right:
        type: blink
        cooldown: 4.0
        params:
          display: '快速位移'
          distance: 6.0
          particle: END_ROD
          sound: ENTITY_ENDERMAN_TELEPORT
      q:
        type: equip_switch
        cooldown: 1.0
        params:
          target: hayate_sword

  # ======================================================== 疾风 · 苦无（2.0 新增 · 标记投掷 + 短距瞬步）
  # 定位：让"上标记"不再依赖队友。不声明 q 槽，用快捷栏 3 切换。
  hayate_kunai:
    character: hayate
    display: '<gray>苦无</gray>'
    material: IRON_SHOVEL
    model-data: 0
    lore:
      - '<gray>左键 <white>苦无刺击（低伤快打）'
      - '<gray>右键 <white>苦无投掷（命中挂易伤 +20%）'
      - '<gray>Shift+右键 <white>影步（瞬移 + 落点伤害减速）'
      - '<gray>1 / 2 / 3 <white>切换剑 / 钢丝 / 苦无'
    attributes:
      attack-damage: 8.0
      attack-speed: 1.5
    default-mode: KUNAI
    modes:
      KUNAI:
        display: '<gray>苦无</gray>'
    skills:
      left:
        type: melee_smash
        cooldown: 0
        params:
          display: '苦无刺击'
          damage: 8.0
          range: 2.6
          angle: 40
          knockback: 0.15
          particle: CRIT
          sound: ENTITY_PLAYER_ATTACK_STRONG
      right:
        type: projectile
        cooldown: 7.0
        params:
          display: '苦无投掷'
          projectile: SNOWBALL
          gravity: false
          speed: 3.0
          damage: 5.0
          radius: 1.8
          mark-bonus: 0.20    # 命中挂 4 秒易伤 +20%
          mark-ticks: 80
          particle: CRIT
          hit-particle: CRIT
          sound: ENTITY_SNOWBALL_THROW
          hit-sound: ENTITY_PLAYER_ATTACK_STRONG
      shift-right:
        type: blink
        cooldown: 8.0
        params:
          display: '影步'
          distance: 5.5
