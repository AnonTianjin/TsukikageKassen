name: Build

# 构建护栏 CI：与本地 build.gradle.kts 的两道护栏（core 纯净 / 参数键收录）
# 和 tools/ 下的离线断言测试保持同一套判定，push 与 PR 都跑。
#
# 推送到 main 时会额外把产物 jar 提交回仓库根目录，文件名 TsukikageKassen-<版本>.jar，
# 版本号读 gradle.properties。提交信息带 [skip ci]，不会自己触发自己。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradle build = 编译 128 个源文件 + checkCorePurity（core 层禁 Bukkit/NMS）
      #              + checkParamKeys（技能参数键必须被 ConfigValidator 收录）
      # 依赖从 Maven Central 与 repo.papermc.io 解析，无需本地 libs/。
      - name: Gradle build
        run: ./gradlew build --no-daemon

      # tools/ 下的离线断言测试：纯 core 逻辑，不依赖 Bukkit，可直接 javac/java 跑。
      # （MinionRegionFilterTest / WeaponYamlEditorTest / MiniMessageClickTest
      #   依赖 paper 层或资源文件，留在本地跑，见 CONTRIBUTING.md）
      - name: Offline assertion tests
        run: |
          mkdir -p build/test-classes
          javac -encoding UTF-8 --release 21 -d build/test-classes \
            src/main/java/com/taketori/kassen/core/match/TeamId.java \
            src/main/java/com/taketori/kassen/core/match/BaseArgParser.java \
            src/main/java/com/taketori/kassen/core/match/sengoku/*.java \
            src/main/java/com/taketori/kassen/core/worlds/WorldScope.java \
            tools/SengokuRoundTest.java \
            tools/TowerContestTest.java \
            tools/BaseArgParserTest.java \
            tools/WorldScopeTest.java
          java -cp build/test-classes SengokuRoundTest
          java -cp build/test-classes TowerContestTest
          java -cp build/test-classes BaseArgParserTest
          java -cp build/test-classes WorldScopeTest

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: TsukikageKassen
          path: build/libs/*.jar
          if-no-files-found: ignore

  # 只在 main 的 push 上跑：把刚构建出来的 jar 放回仓库根目录并提交。
  # PR 不跑，避免把 fork 的产物写进主干；产物没变时 git diff 为空，不会产生空提交。
  commit-jar:
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit != null &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: TsukikageKassen
          path: dist

      - name: Place jar under versioned name
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r' | head -n1)
          if [ -z "$version" ]; then echo "gradle.properties 里没读到 version"; exit 1; fi
          src=$(find dist -maxdepth 1 -name '*.jar' | head -n1)
          if [ -z "$src" ]; then echo "构建产物里没有 jar"; exit 1; fi
          # 旧版本的 jar 不留在仓库里，只保留当前版本这一个文件
          find . -maxdepth 1 -name 'TsukikageKassen-*.jar' -delete
          cp "$src" "TsukikageKassen-${version}.jar"
          echo "版本 ${version}，来源 $(basename "$src")，大小 $(stat -c%s "TsukikageKassen-${version}.jar") 字节"
          echo "SHA256 $(sha256sum "TsukikageKassen-${version}.jar" | cut -d' ' -f1)"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A 'TsukikageKassen-*.jar'
          if git diff --cached --quiet; then
            echo '产物与仓库里的完全一致，跳过提交'
            exit 0
          fi
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r' | head -n1)
          git commit -m "自动更新构建产物 ${version} [skip ci]"
          git push origin HEAD:main
