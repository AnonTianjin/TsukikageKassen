name: Build

# 构建护栏 CI：与本地 build.gradle.kts 的两道护栏（core 纯净 / 参数键收录）
# 和 tools/ 下的离线断言测试保持同一套判定，push 与 PR 都跑。
#
# 产物 jar 不进仓库：每次构建上传成 Actions artifact（保留期由 GitHub 决定），
# 正式发布的 jar 挂在 GitHub Release 资产上，本地构建走 build/libs/ 或 build/dist/。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # gradle build = 编译全部源文件 + 三道护栏：
      #   checkCorePurity（core 层禁 Bukkit/NMS）
      #   checkParamKeys（技能参数键必须被 ConfigValidator 收录）
      #   offlineCheck（tools/ 下 9 个离线断言/校验程序全跑，清单见 build.gradle.kts 的 offlineTools）
      # 依赖从 Maven Central 与 repo.papermc.io 解析，无需本地 libs/。
      - name: Gradle build
        run: ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: TsukikageKassen
          path: build/libs/*.jar
          if-no-files-found: ignore
