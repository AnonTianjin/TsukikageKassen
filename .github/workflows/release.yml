name: Release

# 发版链路：打 tag 才触发。和 Build 的区别只在最后一步——把 jar 挂到 GitHub Release 上，
# 而不是当成短命 artifact。构建本身仍是同一条 ./gradlew build，三道护栏照跑。
#
# 手工重发：workflow_dispatch 填已存在的 tag（如 v2.0.1），会重跑构建并覆盖同名资产。
#
# action 全部按 commit SHA 固定，后面的注释是它对应的版本，由 dependabot 提 PR 更新。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 tag，例如 v2.0.1
        required: true
        type: string
      dry_run:
        description: 只构建不发布，用来试跑这条链路
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # fetch-depth: 0 是给 --generate-notes 用的：它要读完整提交历史。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      # tag 是发版的对外名字，gradle.properties 的 version 是 jar 内 plugin.yml 的版本，
      # 两者不一致就是发错版本，宁可在这里停下。
      - name: Check tag against gradle.properties
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' gradle.properties | head -n 1)
          if [ "v${version}" != "${TAG}" ]; then
            echo "tag ${TAG} 与 gradle.properties 的 version=${version} 不一致，先改版本再发版" >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Gradle build
        run: ./gradlew build --no-daemon

      - name: Summarize jar
        id: jar
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' gradle.properties | head -n 1)
          jar="build/libs/TsukikageKassen-${version}.jar"
          sha=$(sha256sum "$jar" | cut -d' ' -f1)
          size=$(stat -c %s "$jar")
          {
            echo "### 发版 ${TAG}"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | ${version} |"
            echo "| 产物 | $(basename "$jar") |"
            echo "| 大小 | ${size} 字节 |"
            echo "| SHA256 | \`${sha}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Release 正文优先用 docs/releases/<版本>.md：发版说明和代码同一个仓库、同一个 PR 里改。
      - name: Publish release asset
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.jar.outputs.version }}"
          jar="build/libs/TsukikageKassen-${version}.jar"
          notes="docs/releases/${version}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$jar" --clobber
          elif [ -f "$notes" ]; then
            gh release create "$TAG" "$jar" --title "TsukikageKassen ${TAG}" --notes-file "$notes"
          else
            echo "docs/releases/${version}.md 不存在，退回自动生成说明" >&2
            gh release create "$TAG" "$jar" --title "TsukikageKassen ${TAG}" --generate-notes
          fi
          echo "release: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
